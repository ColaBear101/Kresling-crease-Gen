<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kresling Studio</title>
<meta name="description" content="Design Kresling origami tubes: exact crease pattern, 3-D fold preview, bistability, snap force, vibration and buckling checks, and fabrication exports (SVG, PDF, PNG, DXF, STL, press molds).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/flat.css">
<link rel="stylesheet" href="css/view3d.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/explorer.css">
<script>
  // Apply a saved light/dark choice before the first paint (js/ui/theme.js owns the key).
  try { var kt = JSON.parse(localStorage.getItem('kresling-studio:v1:theme')); if (kt === 'light' || kt === 'dark') document.documentElement.setAttribute('data-theme', kt); } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header id="topbar" aria-label="Kresling Studio"></header>

  <aside id="sidebar" aria-label="Design parameters"></aside>

  <main id="center">
    <div id="center-tabs" class="tabs" role="tablist" aria-label="Centre view">
      <button type="button" class="tab" role="tab" id="tab-pattern" data-tab="pattern" aria-controls="pane-pattern" aria-selected="true">Pattern</button>
      <button type="button" class="tab" role="tab" id="tab-mold" data-tab="mold" aria-controls="pane-mold" aria-selected="false" tabindex="-1">Press molds</button>
      <button type="button" class="tab" role="tab" id="tab-explorer" data-tab="explorer" aria-controls="pane-explorer" aria-selected="false" tabindex="-1">Explorer</button>
    </div>
    <section id="pane-pattern" class="pane" role="tabpanel" aria-labelledby="tab-pattern"></section>
    <section id="pane-mold" class="pane" role="tabpanel" aria-labelledby="tab-mold" hidden></section>
    <section id="pane-explorer" class="pane" role="tabpanel" aria-labelledby="tab-explorer" hidden></section>
  </main>

  <aside id="right" aria-label="3-D preview and analysis">
    <section id="pane-3d" class="pane" aria-label="3-D fold preview"></section>
    <section id="pane-analysis" class="pane" aria-label="Analysis"></section>
  </aside>

  <section id="actions" aria-label="Export and print"></section>
</div>

<nav id="section-nav" class="section-nav" aria-label="Jump to section"></nav>

<div id="toast-root" aria-live="polite"></div>

<dialog id="sources" aria-labelledby="sources-title"></dialog>

<noscript><p class="noscript">Kresling Studio runs in the browser and needs JavaScript. Enable it, or open dist/kresling.html from a local copy.</p></noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
